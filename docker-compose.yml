version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: household-app
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - GIN_MODE=${GIN_MODE:-debug}
      - PORT=${PORT:-8080}
      - DB_PATH=/app/data/household.db
    restart: unless-stopped

  # 開発用サービス（ホットリロード対応）
  dev:
    image: golang:1.21-alpine
    container_name: household-app-dev
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    environment:
      - GIN_MODE=debug
      - PORT=8080
      - DB_PATH=/app/data/household.db
    command: >
      sh -c "apk add --no-cache gcc musl-dev &&
             go run main.go"
    profiles:
      - dev

volumes:
  go-mod-cache:
