name: Deploy to Cloud Run

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deploy config
        id: config
        run: |
          if [ "${{ env.DEPLOY_ENV }}" = "production" ]; then
            echo "SERVICE_NAME=household-app" >> $GITHUB_OUTPUT
          else
            echo "SERVICE_NAME=household-app-stg" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          if [ "${{ env.DEPLOY_ENV }}" = "production" ]; then
            gcloud run deploy ${{ steps.config.outputs.SERVICE_NAME }} \
              --source . \
              --region ${{ env.REGION }} \
              --allow-unauthenticated \
              --max-instances=1 \
              --add-volume=name=gcs-data,type=cloud-storage,bucket=household-app-litestream-backup \
              --add-volume-mount=volume=gcs-data,mount-path=/app/data \
              --execution-environment=gen2 \
              --set-env-vars=DB_PATH=/app/data/app.db,USER_DB_BASE_PATH=/app/data/users
          else
            gcloud run deploy ${{ steps.config.outputs.SERVICE_NAME }} \
              --source . \
              --region ${{ env.REGION }} \
              --allow-unauthenticated
          fi